# Base properties for the template. minecraft_version / yarn_mappings /
# loader_version are appended by DockerBuildService / DockerDecompileService
# at container-build time based on the project's selected versions.
org.gradle.jvmargs=-Xmx2G

mod_version=1.0.0
maven_group=com.example
archives_base_name=examplemod

# Approximate Fabric API version compatible with recent 1.2x.x releases.
# Adjust per Minecraft version if a build fails on a missing fabric-api artifact.
fabric_version=0.100.0+1.21.1
